services:
  currency-cron:
    build: .
    container_name: lab03-currency-cron
    # Load BASE_URL / API_KEY from .env if present (create it from sample.env).
    # Fall back to defaults so the container still starts without it.
    env_file:
      - path: .env
        required: false
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - API_KEY=${API_KEY:-EXAMPLE_API_KEY}
    volumes:
      # Persist script outputs (data/*.json, full.log) and cron log on the host
      - ./data:/app/data
      - cron-log:/var/log/cron.log
    restart: unless-stopped

volumes:
  cron-log:
